[project]
name = "tarnisheds-arsenal-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.pyright]
pythonVersion = "3.12"
include = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Ruff's pre-0.16 default rules; adopting the newer defaults is a separate cleanup.
select = ["E4", "E7", "E9", "F"]
