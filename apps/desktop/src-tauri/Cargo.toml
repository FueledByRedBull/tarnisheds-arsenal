[package]
name = "tarnisheds-arsenal-desktop"
version = "0.19.0"
description = "Tarnished's Arsenal desktop app"
authors = ["Tarnished's Arsenal contributors"]
license = "MIT"
edition = "2024"
default-run = "tarnisheds-arsenal-desktop"

# Keep the default panic = "unwind": worker panics must become a job error (see lib.rs).
[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
er_optimizer_core = { path = "../../../core/er_optimizer_core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
