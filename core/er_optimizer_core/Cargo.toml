[package]
name = "er_optimizer_core"
version = "0.9.3"
edition = "2024"

[lib]
name = "er_optimizer_core"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
csv = "1.3"
pyo3 = { version = "0.22.6", features = ["abi3-py310", "extension-module"], optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
