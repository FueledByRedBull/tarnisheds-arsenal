[package]
name = "er_optimizer_core"
version = "0.21.0"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
brotli-decompressor = "6"
csv = "1.3"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
brotli = "8"
serde_json = "1"
sha2 = "0.10"
