[package]
name = "er_optimizer_core"
version = "0.14.0"
edition = "2024"

[lib]
name = "er_optimizer_core"
crate-type = ["rlib"]

[dependencies]
csv = "1.3"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
