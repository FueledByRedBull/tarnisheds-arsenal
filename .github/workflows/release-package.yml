name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the version tag and publish the release after packaging"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require the default branch for manual publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_NAME" -ne "${{ github.event.repository.default_branch }}") {
            throw "Manual publication must run from the default branch; got $env:GITHUB_REF_NAME"
          }

      - name: Wait for successful CI on this commit
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $deadline = [DateTime]::UtcNow.AddMinutes(40)
          while ([DateTime]::UtcNow -lt $deadline) {
            $runs = @(
              gh run list `
                --workflow ci.yml `
                --commit $env:GITHUB_SHA `
                --event push `
                --limit 20 `
                --json databaseId,status,conclusion,headBranch,headSha,url,createdAt |
                ConvertFrom-Json
            ) | Where-Object {
              $_.headSha -eq $env:GITHUB_SHA -and
              $_.headBranch -eq $env:RELEASE_BRANCH
            } |
              Sort-Object createdAt -Descending

            $latest = $runs | Select-Object -First 1
            if ($latest.status -eq "completed") {
              if ($latest.conclusion -ne "success") {
                throw "CI run $($latest.databaseId) concluded $($latest.conclusion): $($latest.url)"
              }
              Write-Output "CI run $($latest.databaseId) succeeded for $env:GITHUB_SHA"
              exit 0
            }

            if ($latest) {
              Write-Output "Waiting for CI run $($latest.databaseId): $($latest.status)"
            } else {
              Write-Output "Waiting for a $env:RELEASE_BRANCH CI run for $env:GITHUB_SHA"
            }
            Start-Sleep -Seconds 15
          }
          throw "Timed out waiting for successful CI on $env:GITHUB_SHA"

  package:
    env:
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
    needs: verify-ci
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            core/er_optimizer_core/target
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Python packaging helpers
        run: |
          python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate release metadata
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $config.version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tag = "v$version"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $localTag = git tag --list $tag
          if ($env:PUBLISH_RELEASE -eq "true" -and $localTag -eq $tag) {
            $existingCommit = git rev-list -n 1 "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or -not $existingCommit) {
              throw "Unable to resolve local release tag $tag"
            }
            if ($existingCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to $existingCommit; expected $env:GITHUB_SHA"
            }
          }
          $artifactVersion = if ($env:PUBLISH_RELEASE -eq "true") { $version } else { "$version-preview-$env:GITHUB_SHA" }
          "ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python tools/phase4/validate_release_metadata.py --tag $tag

      - name: Build Tauri release package
        env:
          PACKAGED_SMOKE_STARTUP_TIMEOUT_MS: 90000
          PACKAGED_SMOKE_START_ATTEMPTS: 2
          PACKAGED_SMOKE_RETRY_COOLDOWN_MS: 5000
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          if ($env:PUBLISH_RELEASE -eq "true") {
            python tools/phase4/package_release.py --skip-validation
          } else {
            python tools/phase4/package_release.py --preview
          }

      - name: Prepare release assets
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Get-Item "dist/TarnishedsArsenal_$env:ARTIFACT_VERSION"
          if (-not $releaseDir) { throw "No release directory found in dist" }
          $zipPath = Join-Path "dist" "TarnishedsArsenal_$env:ARTIFACT_VERSION.zip"
          $assetDir = "dist/release-assets"
          New-Item -ItemType Directory -Force $assetDir | Out-Null

          $exeCandidates = @(Get-ChildItem $releaseDir.FullName -Filter "*.exe")
          $msiCandidates = @(Get-ChildItem $releaseDir.FullName -Filter "*.msi")
          if ($exeCandidates.Count -ne 1) { throw "Expected one portable executable; found $($exeCandidates.Count)" }
          if ($msiCandidates.Count -ne 1) { throw "Expected one MSI; found $($msiCandidates.Count)" }
          $exePath = $exeCandidates[0]
          $msiPath = $msiCandidates[0]
          $checksumsPath = Join-Path $releaseDir.FullName "SHA256SUMS.txt"
          $reportPath = Join-Path $releaseDir.FullName "build-report.json"
          if (-not $exePath) { throw "No portable executable found in $($releaseDir.FullName)" }
          if (-not $msiPath) { throw "No MSI found in $($releaseDir.FullName)" }
          if (-not (Test-Path $zipPath)) { throw "No release archive found at $zipPath" }
          if (-not (Test-Path $checksumsPath)) { throw "No checksum file found in $($releaseDir.FullName)" }
          if (-not (Test-Path $reportPath)) { throw "No build report found in $($releaseDir.FullName)" }

          $exeUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_portable.exe"
          $msiUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_x64_en-US.msi"
          $zipUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION.zip"
          $checksumsUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_SHA256SUMS.txt"
          $reportUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_build-report.json"
          Copy-Item -LiteralPath $exePath.FullName -Destination $exeUpload -Force
          Copy-Item -LiteralPath $msiPath.FullName -Destination $msiUpload -Force
          Copy-Item -LiteralPath $zipPath -Destination $zipUpload -Force
          Copy-Item -LiteralPath $checksumsPath -Destination $checksumsUpload -Force
          Copy-Item -LiteralPath $reportPath -Destination $reportUpload -Force

          "RELEASE_EXE=$exeUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MSI=$msiUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$zipUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUMS=$checksumsUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_REPORT=$reportUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release provenance and checksums
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content -LiteralPath $env:RELEASE_REPORT -Raw | ConvertFrom-Json
          if ($report.version -ne $env:RELEASE_VERSION) {
            throw "Build report version mismatch: $($report.version); expected $env:RELEASE_VERSION"
          }
          if ($report.commit -ne $env:GITHUB_SHA) {
            throw "Build report commit mismatch: $($report.commit); expected $env:GITHUB_SHA"
          }
          if ($report.sourceDirty -ne $false) {
            throw "Build report source is dirty"
          }
          $expectedSkip = $env:PUBLISH_RELEASE -eq "true"
          if ($report.validationSkipped -ne $expectedSkip) {
            throw "Build report source-validation mode does not match publication/preview mode"
          }
          if ($report.dataManifestIds.vanilla -notmatch '^vanilla-' -or $report.dataManifestIds.convergence -notmatch '^convergence-') {
            throw "Build report does not identify both Vanilla and Convergence snapshots"
          }
          if ($report.codeSigned -eq $true) {
            foreach ($path in @($env:RELEASE_EXE, $env:RELEASE_MSI)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne "Valid") {
                throw "Invalid Authenticode signature for $path`: $($signature.Status)"
              }
            }
          }

          $requiredGates = @(
            "frontend-build",
            "tauri-release-build",
            "windows-msi-identity",
            "packaged-app-smoke"
          )
          if (-not $expectedSkip) {
            $requiredGates += @(
              "release-metadata", "python-unit-tests", "ruff", "pyright", "rustfmt",
              "clippy", "core-tests", "tauri-tests", "runtime-data-validation",
              "playwright-browser", "frontend-tests", "frontend-e2e"
            )
          }
          foreach ($gate in $requiredGates) {
            if ($gate -notin $report.completedGates) {
              throw "Build report is missing validation gate: $gate"
            }
          }

          $checksumRows = @{}
          foreach ($line in Get-Content -LiteralPath $env:RELEASE_CHECKSUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum row: $line"
            }
            $checksumRows[$Matches[2]] = $Matches[1]
          }
          if ($checksumRows.Count -ne 2 -or @($report.artifacts).Count -ne 2) {
            throw "Expected exactly two binary checksum and provenance rows"
          }

          foreach ($path in @($env:RELEASE_EXE, $env:RELEASE_MSI)) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -le 0) { throw "Release asset is empty: $($file.Name)" }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($checksumRows[$file.Name] -ne $actualHash) {
              throw "Checksum mismatch for $($file.Name)"
            }
            $reported = @($report.artifacts | Where-Object { $_.name -eq $file.Name })
            if ($reported.Count -ne 1) {
              throw "Build report must contain exactly one row for $($file.Name)"
            }
            if ($reported[0].sha256 -ne $actualHash -or $reported[0].bytes -ne $file.Length) {
              throw "Build report artifact mismatch for $($file.Name)"
            }
          }

          foreach ($path in @($env:RELEASE_ZIP, $env:RELEASE_CHECKSUMS, $env:RELEASE_REPORT)) {
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Release asset is empty: $path"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archivePath = (Resolve-Path -LiteralPath $env:RELEASE_ZIP).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $archiveNames = @($archive.Entries | ForEach-Object { $_.Name })
            foreach ($name in @(
              "TarnishedsArsenal_$env:ARTIFACT_VERSION`_portable.exe",
              "TarnishedsArsenal_$env:ARTIFACT_VERSION`_x64_en-US.msi",
              "SHA256SUMS.txt",
              "build-report.json",
              "README.md",
              "LICENSE"
            )) {
              if ($name -notin $archiveNames) { throw "Release archive is missing $name" }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:RELEASE_TAG
          $assetDir = "dist/release-assets"
          New-Item -ItemType Directory -Force $assetDir | Out-Null
          $notesOut = Join-Path $assetDir "release-notes-$tag.md"
          $notesSource = Join-Path "docs/release-notes" "$tag.md"
          if (Test-Path $notesSource) {
            Copy-Item -LiteralPath $notesSource -Destination $notesOut -Force
          } else {
            throw "Missing release notes at $notesSource"
          }

          $notesText = Get-Content $notesOut -Raw
          if ($notesText -notmatch "Full Changelog") {
            $previousNativeCommandUseErrorActionPreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            $previousTag = git describe --tags --abbrev=0 "$($env:GITHUB_SHA)^" 2>$null
            $describeExitCode = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $previousNativeCommandUseErrorActionPreference
            if ($describeExitCode -eq 0 -and $previousTag) {
              "`nFull Changelog: https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTag...$tag`n" |
                Out-File -FilePath $notesOut -Encoding utf8 -Append
            }
          }

          "RELEASE_NOTES=$notesOut" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload dist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-${{ env.ARTIFACT_VERSION }}
          if-no-files-found: error
          path: |
            dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"

      - name: Download the verified package from this run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gh run download $env:GITHUB_RUN_ID --name "package-$version" --dir dist

      - name: Create release tag for manual publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagRef = "refs/tags/$env:RELEASE_TAG"

          function Get-RemoteTagCommit {
            $lines = @(git ls-remote origin $tagRef "${tagRef}^{}")
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect remote release tag $env:RELEASE_TAG"
            }
            $direct = $null
            foreach ($line in $lines) {
              $parts = $line -split "\s+"
              if ($parts.Count -lt 2) { continue }
              if ($parts[1] -eq "${tagRef}^{}") { return $parts[0] }
              if ($parts[1] -eq $tagRef) { $direct = $parts[0] }
            }
            return $direct
          }

          $remoteCommit = Get-RemoteTagCommit
          if ($remoteCommit) {
            if ($remoteCommit -ne $env:GITHUB_SHA) {
              throw "Remote release tag $env:RELEASE_TAG already points to $remoteCommit; expected $env:GITHUB_SHA"
            }
            Write-Output "Remote release tag $env:RELEASE_TAG already points to $env:GITHUB_SHA"
            exit 0
          }

          $localTag = git tag --list $env:RELEASE_TAG
          if ($localTag -eq $env:RELEASE_TAG) {
            $localCommit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG^{commit}"
            if ($LASTEXITCODE -ne 0 -or -not $localCommit) {
              throw "Unable to resolve local release tag $env:RELEASE_TAG"
            }
            if ($localCommit -ne $env:GITHUB_SHA) {
              throw "Local release tag $env:RELEASE_TAG already points to $localCommit; expected $env:GITHUB_SHA"
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $env:RELEASE_TAG -m "Release $env:RELEASE_TAG" $env:GITHUB_SHA
          }

          $PSNativeCommandUseErrorActionPreference = $false
          git push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            $remoteCommit = Get-RemoteTagCommit
            if ($remoteCommit -ne $env:GITHUB_SHA) {
              throw "Unable to publish release tag $env:RELEASE_TAG at $env:GITHUB_SHA"
            }
            Write-Output "Release tag $env:RELEASE_TAG was created concurrently at $env:GITHUB_SHA"
          }

      - name: Verify release tag before publication
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $lines = @(git ls-remote origin $tagRef "${tagRef}^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect remote release tag $env:RELEASE_TAG before publication"
          }
          $direct = $null
          $peeled = $null
          foreach ($line in $lines) {
            $parts = $line -split "\s+"
            if ($parts.Count -lt 2) { continue }
            if ($parts[1] -eq "${tagRef}^{}") { $peeled = $parts[0] }
            if ($parts[1] -eq $tagRef) { $direct = $parts[0] }
          }
          $remoteCommit = if ($peeled) { $peeled } else { $direct }
          if ($remoteCommit -ne $env:GITHUB_SHA) {
            throw "Remote release tag $env:RELEASE_TAG points to $remoteCommit; expected $env:GITHUB_SHA"
          }

      - name: Publish and verify GitHub release
        run: python tools/phase4/publish_release.py --repo $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG --commit $env:GITHUB_SHA --assets dist/release-assets
