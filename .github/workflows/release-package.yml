name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release-package.yml
      - tools/phase4/package_release.py
      - tools/phase4/publish_release.py
      - tools/phase4/release_gate.py
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/Cargo.toml
      - core/er_optimizer_core/build.rs
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the version tag and publish the release after packaging"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      verified-sha: ${{ steps.verify.outputs.verified-sha }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout release gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: tools/phase4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"

      - name: Require the default branch for manual publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/phase4/release_gate.py require-default-branch

      - name: Wait for successful CI on this commit
        id: verify
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/phase4/release_gate.py wait-for-ci

  package:
    env:
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
      VERIFIED_CI_SHA: ${{ needs.verify-ci.outputs.verified-sha }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    needs: verify-ci
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Setup Rust
        # Installs the toolchain rust-toolchain.toml pins, or RUSTUP_TOOLCHAIN where a job sets it.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install --profile minimal --no-self-update
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose

      - name: Install Python packaging helpers
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-validation.txt

      - name: Validate release metadata
        run: python tools/phase4/release_gate.py release-metadata

      - name: Build Tauri release package
        env:
          # Pull requests and previews also run this step; only publication receives signing secrets.
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ env.PUBLISH_RELEASE == 'true' && secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 || '' }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ env.PUBLISH_RELEASE == 'true' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: python tools/phase4/release_gate.py package

      - name: Upload e2e failure traces
        if: ${{ failure() && hashFiles('apps/desktop/test-results/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-e2e-failure-traces
          path: apps/desktop/test-results/
          retention-days: 14

      - name: Prepare release assets
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Get-Item "dist/TarnishedsArsenal_$env:ARTIFACT_VERSION"
          if (-not $releaseDir) { throw "No release directory found in dist" }
          $zipPath = Join-Path "dist" "TarnishedsArsenal_$env:ARTIFACT_VERSION.zip"
          $assetDir = "dist/release-assets"
          New-Item -ItemType Directory -Force $assetDir | Out-Null

          $exeCandidates = @(Get-ChildItem $releaseDir.FullName -Filter "*.exe")
          $msiCandidates = @(Get-ChildItem $releaseDir.FullName -Filter "*.msi")
          if ($exeCandidates.Count -ne 1) { throw "Expected one portable executable; found $($exeCandidates.Count)" }
          if ($msiCandidates.Count -ne 1) { throw "Expected one MSI; found $($msiCandidates.Count)" }
          $exePath = $exeCandidates[0]
          $msiPath = $msiCandidates[0]
          $checksumsPath = Join-Path $releaseDir.FullName "SHA256SUMS.txt"
          $reportPath = Join-Path $releaseDir.FullName "build-report.json"
          if (-not $exePath) { throw "No portable executable found in $($releaseDir.FullName)" }
          if (-not $msiPath) { throw "No MSI found in $($releaseDir.FullName)" }
          if (-not (Test-Path $zipPath)) { throw "No release archive found at $zipPath" }
          if (-not (Test-Path $checksumsPath)) { throw "No checksum file found in $($releaseDir.FullName)" }
          if (-not (Test-Path $reportPath)) { throw "No build report found in $($releaseDir.FullName)" }

          $exeUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_portable.exe"
          $msiUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_x64_en-US.msi"
          $zipUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION.zip"
          $checksumsUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_SHA256SUMS.txt"
          $reportUpload = Join-Path $assetDir "TarnishedsArsenal_$env:ARTIFACT_VERSION`_build-report.json"
          Copy-Item -LiteralPath $exePath.FullName -Destination $exeUpload -Force
          Copy-Item -LiteralPath $msiPath.FullName -Destination $msiUpload -Force
          Copy-Item -LiteralPath $zipPath -Destination $zipUpload -Force
          Copy-Item -LiteralPath $checksumsPath -Destination $checksumsUpload -Force
          Copy-Item -LiteralPath $reportPath -Destination $reportUpload -Force

          "RELEASE_EXE=$exeUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MSI=$msiUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$zipUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUMS=$checksumsUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_REPORT=$reportUpload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release provenance and checksums
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content -LiteralPath $env:RELEASE_REPORT -Raw | ConvertFrom-Json
          if ($report.version -ne $env:RELEASE_VERSION) {
            throw "Build report version mismatch: $($report.version); expected $env:RELEASE_VERSION"
          }
          if ($report.commit -ne $env:GITHUB_SHA) {
            throw "Build report commit mismatch: $($report.commit); expected $env:GITHUB_SHA"
          }
          if ($report.sourceDirty -ne $false) {
            throw "Build report source is dirty"
          }
          $expectedSkip = -not [string]::IsNullOrEmpty($env:VERIFIED_CI_SHA)
          if ($report.validationSkipped -ne $expectedSkip) {
            throw "Build report source-validation mode does not match verified CI mode"
          }
          if ($report.dataManifestIds.vanilla -notmatch '^vanilla-' -or $report.dataManifestIds.convergence -notmatch '^convergence-') {
            throw "Build report does not identify both Vanilla and Convergence snapshots"
          }
          if ($report.codeSigned -eq $true) {
            foreach ($path in @($env:RELEASE_EXE, $env:RELEASE_MSI)) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne "Valid") {
                throw "Invalid Authenticode signature for $path`: $($signature.Status)"
              }
            }
          }

          $requiredGates = @(
            "frontend-build",
            "tauri-release-build",
            "windows-msi-identity",
            "packaged-app-smoke"
          )
          if (-not $expectedSkip) {
            $requiredGates += @(
              "release-metadata", "python-unit-tests", "ruff", "pyright", "rustfmt",
              "clippy", "core-tests", "tauri-tests", "data-snapshot-validation",
              "frontend-lint", "dto-contracts", "playwright-browser", "frontend-tests", "frontend-e2e"
            )
          }
          foreach ($gate in $requiredGates) {
            if ($gate -notin $report.completedGates) {
              throw "Build report is missing validation gate: $gate"
            }
          }

          $checksumRows = @{}
          foreach ($line in Get-Content -LiteralPath $env:RELEASE_CHECKSUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum row: $line"
            }
            $checksumRows[$Matches[2]] = $Matches[1]
          }
          if ($checksumRows.Count -ne 3 -or @($report.artifacts).Count -ne 2) {
            throw "Expected checksum rows for the executable, MSI and archive, and two provenance rows"
          }
          $zipFile = Get-Item -LiteralPath $env:RELEASE_ZIP
          if ($checksumRows[$zipFile.Name] -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $zipFile.FullName).Hash.ToLowerInvariant()) {
            throw "Checksum mismatch for $($zipFile.Name)"
          }

          foreach ($path in @($env:RELEASE_EXE, $env:RELEASE_MSI)) {
            $file = Get-Item -LiteralPath $path
            if ($file.Length -le 0) { throw "Release asset is empty: $($file.Name)" }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($checksumRows[$file.Name] -ne $actualHash) {
              throw "Checksum mismatch for $($file.Name)"
            }
            $reported = @($report.artifacts | Where-Object { $_.name -eq $file.Name })
            if ($reported.Count -ne 1) {
              throw "Build report must contain exactly one row for $($file.Name)"
            }
            if ($reported[0].sha256 -ne $actualHash -or $reported[0].bytes -ne $file.Length) {
              throw "Build report artifact mismatch for $($file.Name)"
            }
          }

          foreach ($path in @($env:RELEASE_ZIP, $env:RELEASE_CHECKSUMS, $env:RELEASE_REPORT)) {
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Release asset is empty: $path"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archivePath = (Resolve-Path -LiteralPath $env:RELEASE_ZIP).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $archiveNames = @($archive.Entries | ForEach-Object { $_.Name })
            if (@($archiveNames | Where-Object { $_ -like "*.msi" }).Count -ne 0) {
              throw "Portable release archive must not include an MSI"
            }
            foreach ($name in @(
              "TarnishedsArsenal_$env:ARTIFACT_VERSION`_portable.exe",
              "SHA256SUMS.txt",
              "build-report.json",
              "README.md",
              "LICENSE",
              "NOTICE"
            )) {
              if ($name -notin $archiveNames) { throw "Release archive is missing $name" }
            }
            $archiveChecksums = @($archive.Entries | Where-Object { $_.Name -eq "SHA256SUMS.txt" })
            if ($archiveChecksums.Count -ne 1) {
              throw "Portable release archive must contain exactly one checksum file"
            }
            $checksumReader = [System.IO.StreamReader]::new($archiveChecksums[0].Open())
            try {
              $checksumText = $checksumReader.ReadToEnd()
            } finally {
              $checksumReader.Dispose()
            }
            $portableName = "TarnishedsArsenal_$env:ARTIFACT_VERSION`_portable.exe"
            $expectedArchiveChecksum = "$($checksumRows[$portableName])  $portableName"
            if ($checksumText.Trim() -cne $expectedArchiveChecksum) {
              throw "Portable release archive checksum file does not match the portable executable"
            }
          } finally {
            $archive.Dispose()
          }
          $expectedEntry = "TarnishedsArsenal_$env:ARTIFACT_VERSION/$portableName"
          python -c "import sys; from pathlib import Path; from tools.phase4.publish_release import verify_portable_archive; verify_portable_archive(Path(sys.argv[1]), sys.argv[2], sys.argv[3])" $env:RELEASE_ZIP $expectedEntry $checksumRows[$portableName]
          if ($LASTEXITCODE -ne 0) { throw "Portable release archive executable validation failed" }

      - name: Attest release build provenance
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.RELEASE_EXE }}
            ${{ env.RELEASE_MSI }}
            ${{ env.RELEASE_ZIP }}

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = $env:RELEASE_TAG
          $assetDir = "dist/release-assets"
          New-Item -ItemType Directory -Force $assetDir | Out-Null
          $notesOut = Join-Path $assetDir "release-notes-$tag.md"
          $notesSource = Join-Path "docs/release-notes" "$tag.md"
          if (Test-Path $notesSource) {
            Copy-Item -LiteralPath $notesSource -Destination $notesOut -Force
          } else {
            throw "Missing release notes at $notesSource"
          }

          $notesText = Get-Content $notesOut -Raw
          if ($notesText -notmatch "Full Changelog") {
            $previousNativeCommandUseErrorActionPreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            $previousTag = git describe --tags --abbrev=0 "$($env:GITHUB_SHA)^" 2>$null
            $describeExitCode = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $previousNativeCommandUseErrorActionPreference
            if ($describeExitCode -eq 0 -and $previousTag) {
              "`nFull Changelog: https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTag...$tag`n" |
                Out-File -FilePath $notesOut -Encoding utf8 -Append
            }
          }

          "RELEASE_NOTES=$notesOut" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ env.ARTIFACT_VERSION }}
          if-no-files-found: error
          path: |
            dist/release-assets/

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    needs: package
    runs-on: windows-2025
    timeout-minutes: 20
    # The release environment requires maintainer approval and allows only main and v* tags.
    environment: release
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release-tag step pushes with these credentials; this job uploads no artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"

      - name: Download the verified package from this run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gh run download $env:GITHUB_RUN_ID --name "package-$version" --dir dist/release-assets

      - name: Create or verify the release tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: python tools/phase4/release_gate.py release-tag

      - name: Publish and verify GitHub release
        run: python tools/phase4/publish_release.py --repo $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG --commit $env:GITHUB_SHA --assets dist/release-assets
