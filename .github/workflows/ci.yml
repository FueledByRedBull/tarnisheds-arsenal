name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-data:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            core/er_optimizer_core/target
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python deps
        run: |
          python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate release metadata
        run: |
          python tools/phase4/validate_release_metadata.py

      - name: Rust tests
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust formatting and Clippy
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path core/er_optimizer_core/Cargo.toml -- --check
          cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Python tests, lint and type checking
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tools/phase1 -p "test_*.py"
          python -m unittest discover -s tools/phase4 -p "test_*.py"
          python -m ruff check tools
          python -m pyright tools

      - name: Dual-profile data/runtime validation
        run: |
          python tools/phase4/validate_phase4.py --report dist/validation/data-validation.json

      - name: Upload data validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: data-validation-report
          if-no-files-found: error
          path: dist/validation/data-validation.json

  desktop-frontend:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: |
          npm ci --prefer-offline --no-audit --fund=false

      - name: Install locked Playwright browser
        working-directory: apps/desktop
        run: |
          node ./node_modules/@playwright/test/cli.js install chromium

      - name: Desktop TypeScript build
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Desktop e2e contract tests
        working-directory: apps/desktop
        run: |
          npm run test:e2e

  linux-core-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.97.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate source checkout
        run: |
          set -e
          cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml
          python -m unittest discover -s tools/phase1 -p "test_*.py"
          python -m unittest discover -s tools/phase4 -p "test_*.py"
          python tools/phase4/validate_phase4.py --report dist/validation/data-validation-linux.json
