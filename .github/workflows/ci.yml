name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-and-data:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            core/er_optimizer_core/target
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python deps
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate release metadata
        run: |
          python tools/phase4/validate_release_metadata.py

      - name: Build and install Rust bindings
        run: |
          python -m maturin build --release --locked --manifest-path core/er_optimizer_core/Cargo.toml --features python
          $wheel = Get-ChildItem core/er_optimizer_core/target/wheels/er_optimizer_core-*.whl | Sort-Object LastWriteTime | Select-Object -Last 1
          python -m pip install --force-reinstall $wheel.FullName

      - name: Rust tests
        run: |
          cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Data/runtime validation
        run: |
          python tools/phase4/validate_phase4.py

  desktop-frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: |
          npm ci --prefer-offline --no-audit --fund=false

      - name: Desktop TypeScript build
        working-directory: apps/desktop
        run: |
          npm run build

      - name: Desktop e2e contract tests
        working-directory: apps/desktop
        run: |
          npm run test:e2e
