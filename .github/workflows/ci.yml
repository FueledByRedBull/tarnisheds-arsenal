name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build and install Rust bindings
        run: |
          python -m maturin build --release --manifest-path core/er_optimizer_core/Cargo.toml --features python
          $wheel = Get-ChildItem core/er_optimizer_core/target/wheels/er_optimizer_core-*.whl | Sort-Object LastWriteTime | Select-Object -Last 1
          python -m pip install --force-reinstall $wheel.FullName

      - name: Rust tests
        run: |
          cargo test --manifest-path core/er_optimizer_core/Cargo.toml
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Data/runtime validation
        run: |
          python tools/phase4/validate_phase4.py

      - name: Desktop TypeScript build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
