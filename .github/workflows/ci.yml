name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
      - name: Validate release metadata
        run: python tools/phase4/validate_release_metadata.py
      # Pinned linter binaries, verified by SHA-256 before use. zizmor runs only its offline
      # audits, so results do not depend on a token or on upstream branch rewrites.
      - name: Lint workflows
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/workflow-linters"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" "$ACTIONLINT_URL"
          curl -fsSL --retry 3 -o "$tools/zizmor.tar.gz" "$ZIZMOR_URL"
          echo "$ACTIONLINT_SHA256  $tools/actionlint.tar.gz" | sha256sum --check --strict
          echo "$ZIZMOR_SHA256  $tools/zizmor.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/zizmor.tar.gz" -C "$tools" zizmor
          "$tools/actionlint" -color
          "$tools/zizmor" --offline --format github .github
      - name: Select checks
        id: scope
        run: python tools/phase4/ci_scope.py

  rust-and-data:
    needs: [select-checks, windows-debug-and-data, windows-release, linux-core-and-data, desktop-frontend]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks
        shell: pwsh
        env:
          SCOPE_RESULT: ${{ needs.select-checks.result }}
          RUST_SELECTED: ${{ needs.select-checks.outputs.rust }}
          FRONTEND_SELECTED: ${{ needs.select-checks.outputs.frontend }}
          DEBUG_RESULT: ${{ needs.windows-debug-and-data.result }}
          RELEASE_RESULT: ${{ needs.windows-release.result }}
          LINUX_RESULT: ${{ needs.linux-core-and-data.result }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
        run: |
          if ($env:SCOPE_RESULT -ne "success" -or
              $env:RUST_SELECTED -cnotin @("true", "false") -or
              $env:FRONTEND_SELECTED -cnotin @("true", "false") -or
              ($env:RUST_SELECTED -eq "true" -and $env:FRONTEND_SELECTED -ne "true")) {
            throw "Check selection failed or returned invalid outputs."
          }
          $rustExpected = if ($env:RUST_SELECTED -eq "true") { "success" } else { "skipped" }
          $frontendExpected = if ($env:FRONTEND_SELECTED -eq "true") { "success" } else { "skipped" }
          if ($env:DEBUG_RESULT -ne $rustExpected -or $env:RELEASE_RESULT -ne $rustExpected -or
              $env:LINUX_RESULT -ne $rustExpected -or $env:FRONTEND_RESULT -ne $frontendExpected) {
            throw "Selected checks did not succeed or unselected checks were not skipped."
          }

  windows-debug-and-data:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.rust == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-tmp/ci-target
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Install Python deps
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-validation.txt

      - name: Python tests, lint and type checking
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m ruff check tools
          python -m pyright tools
          python -m unittest discover -s tools/phase1 -p "test_*.py"
          python -m unittest discover -s tools/phase4 -p "test_*.py"

      - name: Dual-profile data snapshot validation
        run: python tools/phase4/validate_phase4.py --report dist/validation/data-validation.json

      - name: Setup Rust
        # Installs the toolchain rust-toolchain.toml pins, or RUSTUP_TOOLCHAIN where a job sets it.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install --profile minimal --no-self-update
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose

      - name: Rust formatting
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path core/er_optimizer_core/Cargo.toml -- --check
          cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            .codex-tmp/ci-target/debug
          key: ${{ runner.os }}-ci-test-opt1-${{ hashFiles('rust-toolchain.toml', 'core/er_optimizer_core/Cargo.toml', 'core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-test-opt1-

      - name: Rust Clippy
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Core tests and benchmark assertions
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
        run: cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml --lib --example benchmark_level_range --timings

      - name: Desktop backend tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --timings

      - name: Upload data validation report
        if: ${{ always() && hashFiles('dist/validation/data-validation.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-validation-report
          if-no-files-found: error
          path: dist/validation/data-validation.json

      - name: Upload Rust build timings
        if: ${{ always() && hashFiles('.codex-tmp/ci-target/cargo-timings/*.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-build-timings
          path: .codex-tmp/ci-target/cargo-timings/*.html
          include-hidden-files: true
          if-no-files-found: error

  windows-release:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.rust == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-tmp/ci-target
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        # Installs the toolchain rust-toolchain.toml pins, or RUSTUP_TOOLCHAIN where a job sets it.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install --profile minimal --no-self-update
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose

      - name: Compiler identity
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            .codex-tmp/ci-target/release
          key: ${{ runner.os }}-ci-release-${{ hashFiles('rust-toolchain.toml', 'core/er_optimizer_core/Cargo.toml', 'core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-release-

      - name: Core release tests and benchmark assertions
        run: cargo test --release --locked --manifest-path core/er_optimizer_core/Cargo.toml --lib --example benchmark_level_range --timings

      - name: Desktop backend release tests
        run: cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --timings

      - name: Check all release targets
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check --release --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets --timings
          cargo check --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --timings

      - name: Upload Rust build timings
        if: ${{ always() && hashFiles('.codex-tmp/ci-target/cargo-timings/*.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-build-timings
          path: .codex-tmp/ci-target/cargo-timings/*.html
          include-hidden-files: true
          if-no-files-found: error

  desktop-frontend:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.frontend == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # Incremental artifacts are never reused in CI and only enlarge the cache.
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: |
          npm ci --prefer-offline --no-audit --fund=false

      - name: Lint, type-check tests and scripts, and check DTO contracts
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm run lint
          npm run test:contracts

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/desktop/package-lock.json') }}

      - name: Install locked Playwright browser
        working-directory: apps/desktop
        run: |
          node ./node_modules/@playwright/test/cli.js install chromium

      - name: Desktop unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Desktop e2e contract tests
        working-directory: apps/desktop
        run: |
          npm run test:e2e

      - name: Upload e2e failure traces
        if: ${{ failure() && hashFiles('apps/desktop/test-results/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-traces
          path: apps/desktop/test-results/
          retention-days: 14

      # The release workflow runs this smoke on the packaged build; running it on
      # every change catches native/UI drift before it can block a release. The
      # Tauri build also runs the TypeScript check and production bundle.
      - name: Setup Rust
        # Installs the toolchain rust-toolchain.toml pins, or RUSTUP_TOOLCHAIN where a job sets it.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install --profile minimal --no-self-update
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose

      - name: Cache native desktop build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/desktop/src-tauri/target/debug
          key: ${{ runner.os }}-ci-desktop-app-${{ hashFiles('rust-toolchain.toml', 'core/er_optimizer_core/Cargo.toml', 'core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-desktop-app-

      - name: Build native desktop
        working-directory: apps/desktop
        run: npm run tauri -- build --debug --no-bundle

      - name: Native desktop smoke test
        working-directory: apps/desktop
        run: npm run test:packaged -- src-tauri/target/debug/tarnisheds-arsenal-desktop.exe

  linux-core-and-data:
    needs: select-checks
    if: ${{ needs.select-checks.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Skips rust-toolchain.toml's clippy/rustfmt install, which conflicts on current
      # Ubuntu runner images; this job runs neither. The validator keeps it in sync.
      RUSTUP_TOOLCHAIN: "1.97.0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Setup Rust
        # Installs the toolchain rust-toolchain.toml pins, or RUSTUP_TOOLCHAIN where a job sets it.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: "1"
        run: |
          rustup toolchain install --profile minimal --no-self-update
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
          rustc --version --verbose

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-validation.txt

      # Deliberately repeats the Windows Python checks: line endings and path
      # separators have broken cross-platform assumptions before.
      - name: Python and snapshot validation
        run: |
          set -e
          python -m unittest discover -s tools/phase1 -p "test_*.py"
          python -m unittest discover -s tools/phase4 -p "test_*.py"
          python tools/phase4/validate_phase4.py

      - name: Core tests and benchmark assertions
        run: cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml --lib --example benchmark_level_range --timings

      - name: Check all Linux targets
        run: cargo check --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets --timings

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      # The independent AR/status oracle needs only the locked TypeScript compiler.
      - name: Install TypeScript for the reference calculator
        working-directory: apps/desktop
        run: npm ci --prefer-offline --no-audit --fund=false --ignore-scripts

      - name: Compare with the pinned reference calculator
        run: python tools/phase4/validate_external_calculator.py --count 100 --seed 20260918

      - name: Upload Rust build timings
        if: ${{ always() && hashFiles('core/er_optimizer_core/target/cargo-timings/*.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test-build-timings
          path: core/er_optimizer_core/target/cargo-timings/*.html
          if-no-files-found: error
