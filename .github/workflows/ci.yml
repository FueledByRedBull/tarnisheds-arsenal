name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-data:
    needs: [windows-debug-and-data, windows-release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Windows checks
        shell: pwsh
        env:
          DEBUG_RESULT: ${{ needs.windows-debug-and-data.result }}
          RELEASE_RESULT: ${{ needs.windows-release.result }}
        run: |
          if ($env:DEBUG_RESULT -ne "success" -or $env:RELEASE_RESULT -ne "success") {
            throw "Windows checks did not both succeed (debug=$env:DEBUG_RESULT, release=$env:RELEASE_RESULT)."
          }

  windows-debug-and-data:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-tmp/ci-target
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Validate release metadata
        run: python tools/phase4/validate_release_metadata.py

      - name: Install Python deps
        run: |
          python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Python tests, lint and type checking
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m ruff check tools
          python -m pyright tools
          python -m unittest discover -s tools/phase1 -p "test_*.py"
          python -m unittest discover -s tools/phase4 -p "test_*.py"

      - name: Dual-profile data/runtime validation
        run: python tools/phase4/validate_phase4.py --report dist/validation/data-validation.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Rust formatting
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path core/er_optimizer_core/Cargo.toml -- --check
          cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            .codex-tmp/ci-target/debug
          key: ${{ runner.os }}-ci-test-opt1-${{ hashFiles('rust-toolchain.toml', 'core/er_optimizer_core/Cargo.toml', 'core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-test-opt1-

      - name: Rust Clippy
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Core tests and benchmark assertions
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
        run: cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml --lib --example benchmark_level_range --timings

      - name: Desktop backend tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --timings

      - name: Core documentation tests
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
        run: cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml --doc --timings

      - name: Desktop documentation tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --doc --timings

      - name: Upload data validation report
        if: ${{ always() && hashFiles('dist/validation/data-validation.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: data-validation-report
          if-no-files-found: error
          path: dist/validation/data-validation.json

      - name: Upload Rust build timings
        if: ${{ always() && hashFiles('.codex-tmp/ci-target/cargo-timings/*.html') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-build-timings
          path: .codex-tmp/ci-target/cargo-timings/*.html
          include-hidden-files: true
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.codex-tmp/ci-target
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Rust formatting and compiler identity
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path core/er_optimizer_core/Cargo.toml -- --check
          cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            .codex-tmp/ci-target/release
          key: ${{ runner.os }}-ci-release-${{ hashFiles('rust-toolchain.toml', 'core/er_optimizer_core/Cargo.toml', 'core/er_optimizer_core/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-release-

      - name: Core release tests and benchmark assertions
        run: cargo test --release --locked --manifest-path core/er_optimizer_core/Cargo.toml --lib --example benchmark_level_range --timings

      - name: Desktop backend release tests
        run: cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --timings

      - name: Check all release targets
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check --release --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets --timings
          cargo check --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --timings

      - name: Rust release documentation tests
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --release --locked --manifest-path core/er_optimizer_core/Cargo.toml --doc --timings
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --doc --timings

      - name: Upload Rust build timings
        if: ${{ always() && hashFiles('.codex-tmp/ci-target/cargo-timings/*.html') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-build-timings
          path: .codex-tmp/ci-target/cargo-timings/*.html
          include-hidden-files: true
          if-no-files-found: error

  desktop-frontend:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: |
          npm ci --prefer-offline --no-audit --fund=false

      - name: Install locked Playwright browser
        working-directory: apps/desktop
        run: |
          node ./node_modules/@playwright/test/cli.js install chromium

      - name: Desktop TypeScript build
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Desktop e2e contract tests
        working-directory: apps/desktop
        run: |
          npm run test:e2e

  linux-core-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.97.0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd # 1.97.0

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Python and snapshot validation
        run: |
          set -e
          python -m unittest discover -s tools/phase1 -p "test_*.py"
          python -m unittest discover -s tools/phase4 -p "test_*.py"
          python tools/phase4/validate_phase4.py --report dist/validation/data-validation-linux.json

      - name: Core tests and benchmark assertions
        run: cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml --lib --example benchmark_level_range --timings

      - name: Rust documentation tests
        run: cargo test --locked --manifest-path core/er_optimizer_core/Cargo.toml --doc --timings

      - name: Check all Linux targets
        run: cargo check --locked --manifest-path core/er_optimizer_core/Cargo.toml --all-targets --timings

      - name: Upload Rust build timings
        if: ${{ always() && hashFiles('core/er_optimizer_core/target/cargo-timings/*.html') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-test-build-timings
          path: core/er_optimizer_core/target/cargo-timings/*.html
          if-no-files-found: error
